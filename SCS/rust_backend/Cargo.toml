[package]
name = "smart-complaint-system-backend"
version = "1.0.0"
edition = "2021"
authors = ["Gilang Ramadan <gilang@teknokrat.ac.id>"]
description = "REST API Backend Smart Complaint System Kota Bandar Lampung (Axum + SQLx + PostgreSQL + PostGIS)"

[dependencies]
# Web framework & Async Runtime (PRD 11.1)
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.36", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Database & SQLx PostgreSQL Driver (PRD 11.1)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization (PRD 11.1)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security & Password Hashing (PRD NFR-02)
bcrypt = "0.15"
jsonwebtoken = "9.2"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.16", features = ["derive"] }

